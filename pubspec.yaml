name: docreader
description: The best PDF & DOCX reader for novels, books, mangas and comics.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  pdfrx: ^2.2.15
  docx_file_viewer: ^1.0.0

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0

  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.22

  file_picker: ^8.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  watcher: ^1.1.0

  shared_preferences: ^2.3.0
  hive_flutter: ^1.1.0

  googleapis: ^13.0.0
  googleapis_auth: ^2.0.0

  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  google_fonts: ^6.2.1
  flex_color_scheme: ^8.2.0

  image: ^4.1.7

  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0
  async: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0